name: PorchLight Release & Zero-Trust Verification (CR-027 / CR-028)

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-test-cron-secret' }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
      TEST_AUTH_PASSWORD: ${{ secrets.TEST_AUTH_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Unit & RLS Isolation Suite
        run: npm run test

      - name: Verify Production Next.js Build
        run: npm run build
